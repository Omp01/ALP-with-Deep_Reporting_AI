[pytest]
# Run from services/api:
#   python -m pytest tests/foundation            # Phase 1 suite: fast, self-contained
#   python -m pytest tests -m "not live"         # everything that does not need a running stack
#
# The older tests in tests/test_*.py are live-HTTP tests against a running API on
# :8000 and a seeded database; they are unaffected by this file.
pythonpath = . ../..
asyncio_mode = auto
markers =
    unit: pure logic, no database
    integration: uses the throwaway test database built by running the real Alembic migrations
